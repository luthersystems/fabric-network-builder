version: '2'

volumes:
  orderer0.example.org:
  orderer1.example.org:
  orderer2.example.org:
  peer0.org1.example.org:
  ca.org1.example.org:
  peer0.org2.example.org:
  ca.org2.example.org:
  peer0.org3.example.org:
  ca.org3.example.org:

networks:
  byfn:

services:
  ca.org1.example.org:
    image: $IMAGE_NS/fabric-ca:$CA_IMAGE_TAG
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org1.example.org-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/CA1_PRIVATE_KEY
    ports:
      - 7054:7054
    command: sh -c 'fabric-ca-server start --ca.certfile /etc/hyperledger/fabric-ca-server-config/ca.org1.example.org-cert.pem --ca.keyfile /etc/hyperledger/fabric-ca-server-config/CA1_PRIVATE_KEY -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/org1.example.org/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca_peerOrg1
    networks:
      - byfn
  ca.org2.example.org:
    image: $IMAGE_NS/fabric-ca:$CA_IMAGE_TAG
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org2.example.org-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/CA2_PRIVATE_KEY
    ports:
      - 8054:7054
    command: sh -c 'fabric-ca-server start --ca.certfile /etc/hyperledger/fabric-ca-server-config/ca.org2.example.org-cert.pem --ca.keyfile /etc/hyperledger/fabric-ca-server-config/CA2_PRIVATE_KEY -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/org2.example.org/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca_peerOrg2
    networks:
      - byfn
  ca.org3.example.org:
    image: $IMAGE_NS/fabric-ca:$CA_IMAGE_TAG
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.org3.example.org-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/CA3_PRIVATE_KEY
    ports:
      - 9054:7054
    command: sh -c 'fabric-ca-server start --ca.certfile /etc/hyperledger/fabric-ca-server-config/ca.org3.example.org-cert.pem --ca.keyfile /etc/hyperledger/fabric-ca-server-config/CA3_PRIVATE_KEY -b admin:adminpw -d'
    volumes:
      - ./crypto-config/peerOrganizations/org3.example.org/ca/:/etc/hyperledger/fabric-ca-server-config
    container_name: ca_peerOrg3
    networks:
      - byfn

  orderer0.example.org:
    extends:
      file:   base/docker-compose-base.yaml
      service: orderer0.example.org
    container_name: orderer0.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn

  orderer1.example.org:
    extends:
      file:   base/docker-compose-base.yaml
      service: orderer1.example.org
    container_name: orderer1.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn

  orderer2.example.org:
    extends:
      file:   base/docker-compose-base.yaml
      service: orderer2.example.org
    container_name: orderer2.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn

  peer0.org1.example.org:
    container_name: peer0.org1.example.org
    extends:
      file:  base/docker-compose-base.yaml
      service: peer0.org1.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn

  peer0.org2.example.org:
    container_name: peer0.org2.example.org
    extends:
      file:  base/docker-compose-base.yaml
      service: peer0.org2.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn

  peer0.org3.example.org:
    container_name: peer0.org3.example.org
    extends:
      file:  base/docker-compose-base.yaml
      service: peer0.org3.example.org
    environment:
      - FABRIC_LOGGING_SPEC
    networks:
      - byfn
