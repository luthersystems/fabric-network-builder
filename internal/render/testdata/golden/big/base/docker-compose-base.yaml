      - ORDERER_CONSENSUS_WALDIR=/var/hyperledger/production/orderer/etcdraft/wal
      - ORDERER_CONSENSUS_SNAPDIR=/var/hyperledger/production/orderer/etcdraft/snapshot
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer1.example.org/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer1.example.org/tls/:/var/hyperledger/orderer/tls
      - orderer1.example.org:/var/hyperledger/production/orderer
    ports:
      - 8050:7050

