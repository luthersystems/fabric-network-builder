      - ORDERER_CONSENSUS_WALDIR=/var/hyperledger/production/orderer/etcdraft/wal
      - ORDERER_CONSENSUS_SNAPDIR=/var/hyperledger/production/orderer/etcdraft/snapshot
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer2.example.org/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer2.example.org/tls/:/var/hyperledger/orderer/tls
      - orderer2.example.org:/var/hyperledger/production/orderer
    ports:
      - 9050:7050

  peer0.org1.example.org:
    container_name: peer0.org1.example.org
    extends:
      file: peer-base.yaml
      service: peer-base
    environment:
      - CORE_PEER_ID=peer0.org1.example.org
      - CORE_PEER_ADDRESS=peer0.org1.example.org:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.org:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.org:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_CHAINCODE_EXECUTETIMEOUT=120s
    volumes:
      - ../crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.example.org:/var/hyperledger/production
    ports:
      - 7051:7051
      - 7053:7053

  peer0.org2.example.org:
    container_name: peer0.org2.example.org
    extends:
