version: '2'

services:

  orderer0.example.org:
    container_name: orderer0.example.org
    image: $IMAGE_NS/fabric-orderer:$IMAGE_TAG
    environment:
      - ORDERER_GENERAL_LOGLEVEL=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      # No system channel: the orderer starts with no channels and joins the
      # application channel through the channel participation API (the admin
      # endpoint below), which create_channel.sh calls with osnadmin. Fabric 3
      # removed the system channel; Fabric 2.3 and later support this flow.
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_GENERAL_KEEPALIVE_SERVERMININTERVAL=30s
      # NOTE:  Raft TLS server & client for a node will use the same cert/key
      # -- This matches the configtx.yaml Orderer.EtcdRaft.Concenters
      # configuration.
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_SENDBUFFERSIZE=50
      # NOTE General.Cluster.ListenPort, General.Cluster.ListenAddress,
      # General.Cluster.ServerCertificate, and General.Cluster.ServerPrivateKey
      # are inherited from the orderer's General.TLS configuration.  None
      # should be set.
      - ORDERER_CONSENSUS_WALDIR=/var/hyperledger/production/orderer/etcdraft/wal
      - ORDERER_CONSENSUS_SNAPDIR=/var/hyperledger/production/orderer/etcdraft/snapshot
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer0.example.org/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/example.org/orderers/orderer0.example.org/tls/:/var/hyperledger/orderer/tls
      - orderer0.example.org:/var/hyperledger/production/orderer
    ports:
      - 7050:7050

