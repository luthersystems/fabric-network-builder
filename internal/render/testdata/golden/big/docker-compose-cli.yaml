version: '2'

volumes:
  orderer0.example.org:
  orderer1.example.org:
  orderer2.example.org:
  peer0.org1.example.org:
  peer0.org2.example.org:
  peer0.org3.example.org:

networks:
  byfn:

services:
  ca.org1.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: ca.org1.example.org
    container_name: ca_peerOrg1
    networks:
      - byfn
  ca.org2.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: ca.org2.example.org
    container_name: ca_peerOrg2
    networks:
      - byfn
  ca.org3.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: ca.org3.example.org
    container_name: ca_peerOrg3
    networks:
      - byfn

  orderer0.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: orderer0.example.org
    container_name: orderer0.example.org
    networks:
      - byfn

  orderer1.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: orderer1.example.org
    container_name: orderer1.example.org
    networks:
      - byfn

  orderer2.example.org:
    extends:
      file:   docker-compose-e2e.yaml
      service: orderer2.example.org
    container_name: orderer2.example.org
    networks:
      - byfn

  peer0.org1.example.org:
    container_name: peer0.org1.example.org
    extends:
      file:   docker-compose-e2e.yaml
      service: peer0.org1.example.org
    networks:
      - byfn

  peer0.org2.example.org:
    container_name: peer0.org2.example.org
    extends:
      file:   docker-compose-e2e.yaml
      service: peer0.org2.example.org
    networks:
      - byfn

  peer0.org3.example.org:
    container_name: peer0.org3.example.org
    extends:
      file:   docker-compose-e2e.yaml
      service: peer0.org3.example.org
    networks:
      - byfn

  cli:
    container_name: cli
    # TOOLS_IMAGE_TAG, not IMAGE_TAG: Fabric 3 publishes no fabric-tools
    # image, so a Fabric 3 network runs a Fabric 2.5 CLI (byfn.sh sets it).
    # The fallback lets an older builder, which sets only IMAGE_TAG, run
    # this file too.
    image: $IMAGE_NS/fabric-tools:${TOOLS_IMAGE_TAG:-$IMAGE_TAG}
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC
      - GOPATH=/opt/gopath
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.example.org:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/crypto-config/peerOrganizations/org1.example.org/users/Admin@org1.example.org/msp
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=true
      - CORE_PEER_TLS_CLIENTCERT_FILE=/crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls/server.crt
      - CORE_PEER_TLS_CLIENTKEY_FILE=/crypto-config/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls/server.key
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ./chaincodes:/chaincodes
      - ./crypto-config:/crypto-config/
      - ./scripts:/scripts
      - ./channel-artifacts:/channel-artifacts
      - ./collections.json:/collections.json
    depends_on:
      - orderer0.example.org
      - orderer1.example.org
      - orderer2.example.org
      - peer0.org1.example.org
      - peer0.org2.example.org
      - peer0.org3.example.org
    networks:
      - byfn
