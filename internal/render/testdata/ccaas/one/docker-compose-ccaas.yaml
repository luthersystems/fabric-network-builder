version: '3.7'
services:
  substrate-peer0:
    image: luthersystems/substrate:$CHAINCODE_VERSION
    command: ["substrate-1.0:feed"]
    ports:
      - "9080:8080"
    networks:
      - byfn
    environment:
      CHAINCODE_OTLP_TRACER_ENDPOINT:
      CHAINCODE_LOG_LEVEL:
networks:
  byfn:
    name: byfn