name: Build Release and Push
on:
  push:
    tags:
      - "*"
jobs:
  # ko builds the amd64 and arm64 images and pushes them and the manifest
  # list (.ko.yaml, `make docker-push`). It cross-compiles, so one runner
  # builds both.
  build-push:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Publish
        run: make docker-push VERSION=$GITHUB_REF_NAME
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
