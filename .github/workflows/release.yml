name: Build Release and Push
on:
  push:
    tags:
      - "*"
jobs:
  build-push-docker:
    name: ${{ matrix.arch }} - docker build push
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ${{ fromJSON('{"arm64":"2vcpu-ubuntu-2204-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
        env:
          # Docker Home OIDC connection ID (a repository variable, not a secret).
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Publish
        run: make docker-push VERSION=$GITHUB_REF_NAME TAG_SUFFIX=-${{ matrix.arch }}
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
  push-docker-manifests:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ubuntu-22.04
    needs:
      - build-push-docker
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
        env:
          # Docker Home OIDC connection ID (a repository variable, not a secret).
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Publish
        run: make push-manifests VERSION=$GITHUB_REF_NAME
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
