name: CI Pipeline

on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # A merge queue tests the merged commit and waits for each required check.
  merge_group:

jobs:
  test:
    name: Go tests and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's toolchain line is the one statement of the Go version.
          go-version-file: go.mod
      - name: Run unit tests
        run: go test -race ./...
        timeout-minutes: 15
      # golangci-lint runs in the shared Quality workflow (quality.yml).
      # `golangci-lint run` accepts an unknown key in .golangci.yml; only the
      # schema check rejects it, so it stays here. Keep the version equal to
      # the shared workflow's pin.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint config schema
        run: golangci-lint config verify

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Build
        run: make
        timeout-minutes: 10

  # Brings a generated network up on each Fabric line the builder supports
  # and checks every node joined the channel. Only a running network shows a
  # break in the channel flow: `generate` succeeds either way. The network has
  # no system channel, so the same config runs on 2.5 and 3.x
  # (luthersystems/substrate#1034).
  network:
    name: Network (Fabric ${{ matrix.fabric }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        fabric:
          - 2.5.16
          - 3.1.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Build
        run: make && docker tag luthersystems/fabric-network-builder:latest fnb-ci
        timeout-minutes: 15
      - name: Compare with the Fabric release tools
        run: tests/fabric-oracle.sh "${{ matrix.fabric }}" fnb-ci
        timeout-minutes: 10
      - name: Bring a network up
        run: tests/network-smoke.sh fnb-ci "${{ matrix.fabric }}"
        timeout-minutes: 15

  # The image must not trust a distrusted CA (such as eMudhra/emSign,
  # CVE-2026-111943), on each platform that release.yml publishes. The base
  # image (.ko.yaml) runs the build-harden kit last; ko only adds the binary.
  # The check reads the exported image with the runner's openssl, so it does
  # not rely on the image's own tools.
  #
  # The check is the org's shared action, not a script in this repo: there is
  # one copy of the check logic, and a fix reaches every repo when v1 moves.
  # ko has no Dockerfile, so the kit is given here. Keep it at the buildenv
  # release of the base image in .ko.yaml.
  trust-store:
    name: Trust store (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build
        run: make KO_PLATFORM="${{ matrix.platform }}" && docker tag luthersystems/fabric-network-builder:latest fnb-ci
        timeout-minutes: 15
      - name: Check the image
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          kit: luthersystems/build-harden:v0.1.53@sha256:f0830ffa253727ce69abe815e65434a5fc16973594b37c938774bd6e1ff4e4e6
          images: fnb-ci ${{ matrix.platform }}
        timeout-minutes: 10
      # The image must start, and run as a user other than root (#28).
      - name: Check that the image starts as non-root
        run: |
          docker run --rm --platform "${{ matrix.platform }}" fnb-ci --help
          user=$(docker image inspect -f '{{.Config.User}}' fnb-ci)
          echo "image user: ${user:-<none>}"
          case "${user}" in ""|root|0|0:*) echo "the image runs as root" >&2; exit 1 ;; esac
        timeout-minutes: 5
