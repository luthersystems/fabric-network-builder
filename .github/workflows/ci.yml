name: CI Pipeline

on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: make test
        timeout-minutes: 5

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Build
        run: make
        timeout-minutes: 10

  # The image must run the build-harden kit last and must not trust a
  # distrusted CA (such as eMudhra/emSign, CVE-2026-111943), on each platform
  # that release.yml publishes. The check reads the exported image with the
  # runner's openssl, so it does not rely on the image's own tools.
  #
  # The check is the org's shared action, not a script in this repo: there is
  # one copy of the check logic, and a fix reaches every repo when v1 moves.
  # It reads the kit (and so the policy) from the build-harden stage that the
  # Dockerfile pins, so the build and the check use the same kit.
  trust-store:
    name: Trust store (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker buildx build --platform "${{ matrix.platform }}" --load -t fnb-ci .
        timeout-minutes: 30
      - name: Check the image
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          dockerfiles: Dockerfile
          images: fnb-ci ${{ matrix.platform }}
        timeout-minutes: 10
      # The image must still start after the kit ran.
      - name: Check that the image starts
        run: docker run --rm --platform "${{ matrix.platform }}" fnb-ci --help
        timeout-minutes: 5
