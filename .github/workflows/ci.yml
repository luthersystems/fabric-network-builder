name: CI Pipeline

on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # A merge queue tests the merged commit and waits for each required check.
  merge_group:

jobs:
  # Decides whether the build and test jobs must run (scripts/ci-changes.sh).
  # No paths filter on the workflow: the gate below is a required check, so
  # every PR must start a run. A docs-only PR skips the jobs instead.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: bash scripts/ci-changes-test.sh
      # Only a pull request may skip. Any other event (push, merge group)
      # runs everything.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: Go tests and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's toolchain line is the one statement of the Go version.
          go-version-file: go.mod
      - name: Run unit tests
        run: go test -race ./...
        timeout-minutes: 15
      # golangci-lint runs in the shared Quality workflow (quality.yml).
      # `golangci-lint run` accepts an unknown key in .golangci.yml; only the
      # schema check rejects it, so it stays here. Keep the version equal to
      # the shared workflow's pin.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint config schema
        run: golangci-lint config verify

  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Build
        run: make
        timeout-minutes: 10

  # Brings a generated network up on each Fabric line the builder supports
  # and checks every node joined the channel. Only a running network shows a
  # break in the channel flow: `generate` succeeds either way. The network has
  # no system channel, so the same config runs on 2.5 and 3.x
  # (luthersystems/substrate#1034).
  network:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: Network (Fabric ${{ matrix.fabric }}${{ matrix.imagens && format(', {0}', matrix.imagens) || '' }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        fabric:
          - 2.5.16
          - 3.1.4
        imagens: [""]
        include:
          # A third leg pulls through a registry-qualified FNB_IMAGENS, so
          # an image path with a registry host must reach every node (#45:
          # acre pulls through an ECR pull-through cache). The smoke test
          # checks each container's image reference, because
          # docker.io/hyperledger names the same images as the default.
          # A new imagens value adds a leg; the default legs stay as they are.
          - fabric: 3.1.4
            imagens: docker.io/hyperledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Build
        run: make
        timeout-minutes: 15
      - name: Compare with the Fabric release tools
        run: tests/fabric-oracle.sh "${{ matrix.fabric }}" luthersystems/fabric-network-builder:latest
        timeout-minutes: 10
      - name: Bring a network up
        env:
          FNB_SMOKE_IMAGENS: ${{ matrix.imagens }}
        run: tests/network-smoke.sh luthersystems/fabric-network-builder:latest "${{ matrix.fabric }}"
        timeout-minutes: 15

  # The image must not trust a distrusted CA (such as eMudhra/emSign,
  # CVE-2026-111943), on each platform that release.yml publishes. The base
  # image (.ko.yaml) runs the build-harden kit last; ko only adds the binary.
  # The check reads the exported image with the runner's openssl, so it does
  # not rely on the image's own tools.
  #
  # The check is the org's shared action, not a script in this repo: there is
  # one copy of the check logic, and a fix reaches every repo when v1 moves.
  # ko has no Dockerfile, so the kit is given here. Keep it at the buildenv
  # release of the base image in .ko.yaml.
  trust-store:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: Trust store (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build
        run: make KO_PLATFORM="${{ matrix.platform }}"
        timeout-minutes: 15
      - name: Check the image
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          kit: luthersystems/build-harden:v0.1.53@sha256:f0830ffa253727ce69abe815e65434a5fc16973594b37c938774bd6e1ff4e4e6
          images: luthersystems/fabric-network-builder:latest ${{ matrix.platform }}
        timeout-minutes: 10
      # The image must start, and run as a user other than root (#28).
      - name: Check that the image starts as non-root
        run: |
          docker run --rm --platform "${{ matrix.platform }}" luthersystems/fabric-network-builder:latest --help
          user=$(docker image inspect -f '{{.Config.User}}' luthersystems/fabric-network-builder:latest)
          echo "image user: ${user:-<none>}"
          case "${user}" in ""|root|0|0:*) echo "the image runs as root" >&2; exit 1 ;; esac
        timeout-minutes: 5

  # The one check main's ruleset requires for this workflow
  # (common-infrastructure github-org-admin/main_protection.json). One gate
  # instead of each job by name: matrix jobs get one check per entry, and a
  # list of names in the ruleset would drift with the workflow.
  # always(), not !cancelled(): a cancelled run must fail this check. A gate
  # that is skipped counts as passed for a required check.
  # scripts/ci-changes-test.sh fails when a job is missing from needs.
  ci-all:
    name: CI (all required checks)
    if: always()
    needs: [changes, test, build, network, trust-store]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
