name: Release (tag)

# On-demand release, dispatched by an operator (or an agent the operator
# directed) with an explicit version. Pattern copied from
# hyphae/.github/workflows/release-tag.yml (itself from lutherauth/reliable):
# the release is cut by the official Claude App via claude-code-action, NOT the
# default GITHUB_TOKEN, because GitHub suppresses workflow->workflow events for
# GITHUB_TOKEN — a GITHUB_TOKEN-created tag would never trigger release.yml's
# tag run (the multiarch luthersystems/fabric-network-builder image build and
# Docker Hub manifest push). The App-token release creates the tag
# server-side; the tag-push event then runs release.yml exactly as a human
# `gh release create vX.Y.Z` does. Direct tag pushes are blocked from agent
# sandboxes, hence this action.
#
# Model auth: Amazon Bedrock via GitHub OIDC, assuming the AWS role
# github-actions-claude-bedrock (managed in luthersystems/common-infrastructure
# storage/github_actions_claude_bedrock.tf). No stored model secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag (vMAJOR.MINOR.PATCH, e.g. v0.0.8). Must be strictly newer than the latest stable tag and is always cut from main HEAD."
        type: string
        required: true
      dry_run:
        description: "Print the validation + notes but do NOT cut the release"
        type: boolean
        default: false

permissions:
  contents: write # gh release create (creates the tag + release)
  id-token: write # AWS role for Bedrock (OIDC), and lets claude-code-action mint the official Claude App token, so the tag triggers release.yml

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: Cut release ${{ inputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags + history for validation and release notes
      - name: Configure AWS credentials for Bedrock (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::637423319757:role/github-actions-claude-bedrock
          aws-region: us-west-2
      - name: Cut the release via Claude
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          # Official-app auth (minted via OIDC using `id-token: write`). Do NOT
          # add a `github_token:` here — a default GITHUB_TOKEN tag does not
          # trigger release.yml, which this release depends on.
          use_bedrock: "true"
          # Print the model's output, so a run that stops says why. The
          # prompt only reads the repo; it handles no secrets.
          show_full_output: "true"
          prompt: |
            Cut a release of fabric-network-builder at the version in the
            RELEASE_VERSION env var. Do exactly this and nothing else — no
            source changes, no PRs, no branch pushes.

            1. Validate, STOPPING with a clear explanation on any failure:
               - RELEASE_VERSION matches ^v[0-9]+\.[0-9]+\.[0-9]+$ exactly.
               - It is STRICTLY newer (semver ordering) than the latest
                 existing STABLE v* tag — ignore pre-release tags carrying a
                 suffix like -SNAPSHOT.1 when finding the latest
                 (`git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1`).
               - No tag named RELEASE_VERSION exists yet
                 (`git tag --list "$RELEASE_VERSION"` prints nothing).
               - The checkout is on the latest main
                 (`git rev-parse HEAD` == `git rev-parse origin/main`).
            2. Notes: summarize the merged PRs / commits since that latest
               stable tag (`git log <lasttag>..HEAD --oneline`). Concise
               plain-Markdown bullets; omit noise.
            3. Ship: if the env var DRY_RUN is "true", PRINT the version and
               notes, then STOP — create nothing. Otherwise run
               `gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION" --target "$(git rev-parse HEAD)" --notes "<notes>"`,
               so the tag lands on the commit you validated.
               The tag-push event triggers release.yml, which builds the
               amd64 and arm64 luthersystems/fabric-network-builder images
               and pushes them and the multiarch manifests to Docker Hub.

            Never invent a different version, never force anything, never
            touch branches or files. If anything is ambiguous, STOP and
            explain rather than guessing.
          claude_args: |
            --allowedTools Bash,Read,Grep,Glob
            --max-turns 30
            --model us.anthropic.claude-opus-5-5
            --fallback-model us.anthropic.claude-sonnet-5-5
